name: Semantic contract release

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  WHEEL_FILENAME: kmqdb_ttrpg_semantic_contracts-1.0.0-py3-none-any.whl
  WHEEL_SHA256: 7fa658b9a1e4a1148942040b318c758ebf2c49bccf27f91577ecb56e007f6e99

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Test semantic contract wheel
        run: PYTHONDONTWRITEBYTECODE=1 python tests/test_ttrpg_semantic_contract_wheel.py -v

      - name: Build semantic contract wheel
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/build_ttrpg_semantic_contract_wheel.py --output-dir dist

      - name: Verify semantic contract wheel
        run: |
          test "$(find dist -maxdepth 1 -type f -printf '%f\n')" = "${WHEEL_FILENAME}"
          echo "${WHEEL_SHA256}  dist/${WHEEL_FILENAME}" | sha256sum --check --strict

      - name: Upload tested semantic contract wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semantic-contract-wheel-1.0.0
          path: dist/${{ env.WHEEL_FILENAME }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/tags/semantic-contracts-v1.0.0'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested semantic contract wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: semantic-contract-wheel-1.0.0
          path: release

      - name: Verify downloaded semantic contract wheel
        run: |
          test "$(find release -maxdepth 1 -type f -printf '%f\n')" = "${WHEEL_FILENAME}"
          echo "${WHEEL_SHA256}  release/${WHEEL_FILENAME}" | sha256sum --check --strict

      - name: Create semantic contract release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/${WHEEL_FILENAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "KMQDB TTRPG Semantic Contracts v1.0.0" \
            --notes "Provider-owned source-free semantic wire contracts version 1.0.0."
